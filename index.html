<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piñatas Estrella · Arte y diversión en cada celebración</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--red:#e1062c;--red2:#b80423;--y:#ffc928;--bg:#000;--card:#130f12;--card2:#1e171c;--line:#3a2b33;--tx:#fff;--mut:#c4b8be}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
background-image:radial-gradient(circle,rgba(225,6,44,.17) 6px,transparent 7px),radial-gradient(circle,rgba(255,255,255,.06) 3px,transparent 4px);background-size:78px 78px;background-position:0 0,39px 39px}
h1,h2,h3,.logo,.script{font-family:'Pacifico','Brush Script MT',cursive;font-weight:400;line-height:1.2}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.st{position:absolute;color:var(--y);animation:fl var(--d) ease-in-out infinite;opacity:.5;transition:transform .5s ease-out}
@keyframes fl{50%{margin-top:-28px;rotate:30deg}}
header,main,footer{position:relative;z-index:1}
header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);border-bottom:4px dotted var(--y)}
.nav{max-width:1180px;margin:auto;padding:.7rem 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:1.7rem;color:#fff;text-decoration:none;text-shadow:3px 3px 0 var(--red)}
.logo span{color:var(--y);text-shadow:3px 3px 0 #7a5a00}
.links{display:flex;gap:4px;align-items:center}
.links a{color:var(--mut);text-decoration:none;font-weight:800;font-size:.92rem;padding:8px 14px;border-radius:99px;transition:.2s}
.links a:hover{color:#fff;background:#ffffff14}
.links a.active{color:#fff;background:var(--red);box-shadow:0 0 0 3px #000,0 0 0 5px var(--y)}
#burger{display:none;background:var(--red);color:#fff;border:2px solid var(--y);border-radius:12px;font-size:1.3rem;padding:4px 12px;cursor:pointer}
@media(max-width:900px){#burger{display:block}.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:#000;padding:14px;border-bottom:4px dotted var(--y)}.links.open{display:flex}.links a{width:100%;text-align:center}}
.view{display:none}.view.active{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.btn{background:var(--red);color:#fff;border:3px solid #fff;padding:12px 26px;border-radius:99px;font:900 1rem 'Nunito',sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--red2);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--red2)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red2)}
.btn.y{background:var(--y);color:#000;border-color:#000;box-shadow:0 5px 0 #a47d00}
.btn:disabled{opacity:.6;pointer-events:none}
.hero{max-width:1180px;margin:auto;padding:46px 20px 30px;display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center}
@media(max-width:860px){.hero{grid-template-columns:1fr;text-align:center}.hero .cta{justify-content:center}.hero-img{order:-1}}
.badge{display:inline-block;background:var(--y);color:#000;font-weight:900;padding:5px 16px;border-radius:99px;transform:rotate(-2deg);margin-bottom:14px}
.hero h1{font-size:clamp(2.2rem,5.2vw,3.7rem);margin-bottom:14px;text-shadow:4px 4px 0 var(--red)}
.hero p{color:var(--mut);font-size:1.12rem;max-width:520px;margin-bottom:24px}
@media(max-width:860px){.hero p{margin-inline:auto}}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-img{position:relative;display:grid;place-items:center}
.hero-img::before{content:"";position:absolute;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(225,6,44,.45),transparent 68%);animation:pulse 3s ease-in-out infinite}
.hero-img img{position:relative;width:min(470px,86vw);cursor:pointer;animation:bob 4s ease-in-out infinite;transition:scale .2s}
.hero-img img:active{scale:.94}
@keyframes bob{50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.tip{position:absolute;bottom:2%;background:#000c;border:2px dashed var(--y);border-radius:99px;padding:2px 14px;font-size:.8rem;font-weight:800;color:var(--y)}
.tick{overflow:hidden;background:var(--red);border-block:4px solid #fff;margin:20px 0;transform:rotate(-1deg)}
.tk{display:flex;width:max-content;animation:mq 26s linear infinite;padding:9px 0;font-weight:900}
.tk span{padding:0 26px;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.wrap{max-width:1180px;margin:auto;padding:36px 20px 64px}
.head{margin-bottom:30px}
.head h2{font-size:clamp(1.8rem,4vw,2.6rem);text-shadow:3px 3px 0 var(--red)}
.head p{color:var(--mut);margin-top:6px}
.dots{height:14px;margin-bottom:16px;background:radial-gradient(circle,#fff 5px,transparent 6px) 0 50%/30px 14px repeat-x;max-width:210px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:var(--card);border:3px solid var(--line);border-radius:30px 30px 8px 30px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;position:relative;transition:border-color .2s}
.card:hover{border-color:var(--y)}
.card h3{font-size:1.35rem;margin:8px 0 4px}
.ico{height:96px;display:flex;align-items:flex-end;margin-bottom:4px}
.ico span{display:block;line-height:1;transition:.3s}
.card:hover .ico span{transform:rotate(14deg) scale(1.1)}
.meta{color:var(--mut);font-weight:600;font-size:.94rem}
.hl{color:var(--y);font-weight:900}
.price{font-size:1.7rem;font-weight:900;color:var(--y)}
.tag{display:inline-block;background:#e1062c26;color:#ff8da1;border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:900}
.gimg{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 30%;border-radius:22px 22px 6px 22px;border:3px solid var(--line);margin-bottom:12px;cursor:zoom-in;transition:border-color .2s}
.gcard:hover .gimg{border-color:var(--y)}
#lb{position:fixed;inset:0;z-index:350;background:#000e;display:none;place-items:center;padding:20px;cursor:zoom-out}#lb.on{display:grid}#lb img{max-height:92vh;max-width:94vw;border-radius:20px;border:4px solid var(--y)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.chip{background:var(--card2);color:#fff;border:2px solid var(--line);border-radius:99px;padding:7px 18px;font:800 .92rem 'Nunito',sans-serif;cursor:pointer}
.chip.on{background:var(--y);color:#000;border-color:var(--y)}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.panel{background:var(--card);border:3px solid var(--line);border-radius:30px;padding:28px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
label{font-weight:800;font-size:.92rem;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
input,select,textarea{width:100%;padding:12px 16px;background:var(--card2);color:#fff;border:2px solid var(--line);border-radius:16px;font:600 .96rem 'Nunito',sans-serif}
input:focus,select:focus,textarea:focus,.chip:focus-visible,.sw:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--y);outline-offset:2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--red)}
.ck{flex-direction:row;align-items:center;gap:10px}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #000;box-shadow:0 0 0 2px var(--line);cursor:pointer;transition:.15s}
.sw.on{box-shadow:0 0 0 3px #fff;transform:scale(1.15)}
.pv{background:radial-gradient(circle at 50% 40%,#2a0a12,#0a0507);border-radius:24px;height:230px;display:grid;place-items:center;overflow:hidden;margin-bottom:16px}
.pv svg{width:200px;height:200px;transition:transform .45s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 8px 14px #000a)}
.est{border:3px dashed var(--y);border-radius:22px;padding:16px;text-align:center;margin:14px 0}
.est b{display:block;font-size:2.3rem;color:var(--y);font-family:'Pacifico',cursive;font-weight:400}
.time{display:inline-block;background:var(--card2);padding:4px 14px;border-radius:99px;font-weight:800;font-size:.86rem;color:var(--y)}
details{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px 22px;margin-bottom:12px}
details[open]{border-color:var(--red)}
summary{font-weight:900;cursor:pointer;font-size:1.05rem}
details p{color:var(--mut);margin-top:10px}
.toast{position:fixed;bottom:22px;left:50%;z-index:300;background:var(--y);color:#000;padding:13px 24px;border-radius:99px;font-weight:900;border:3px solid #000;box-shadow:0 8px 24px #000a;transform:translate(-50%,160%);transition:transform .35s cubic-bezier(.3,1.6,.5,1);max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:400}
footer{text-align:center;padding:30px 20px;background:var(--card);border-top:4px dotted var(--y);color:var(--mut);font-weight:700}
footer b{color:var(--y)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="stars"></div><canvas id="cf"></canvas>
<div id="app"></div>
<div id="toast" class="toast"></div><div id="lb"></div>

function burst(x,y,n=70){const C=["#e1062c","#ffc928","#fff","#ff6b81"];

  if(!run){run=true;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot+=.12);p.s?cx.fillText("★",-8,6):cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  if(P.length)requestAnimationFrame(loop);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
document.addEventListener("click",e=>{const im=e.target.closest(".gimg");if(im){$("lb").innerHTML=`<img src="${im.src}" alt="${im.alt}">`;$("lb").classList.add("on");return}if(e.target.closest("#lb")){$("lb").classList.remove("on");return}if(e.target.closest(".btn:not([type=submit])"))burst(e.clientX,e.clientY,45)});

/* estrellas de fondo con paralaje */
const SB=$("stars");
for(let i=0;i<14;i++){const s=document.createElement("span");s.className="st";s.textContent="★";
  s.style.cssText=`left:${Math.random()*96}%;top:${Math.random()*92}%;font-size:${14+Math.random()*28}px;--d:${5+Math.random()*5}s;animation-delay:-${Math.random()*6}s`;s.dataset.k=(Math.random()*.04+.01).toFixed(3);SB.appendChild(s)}
addEventListener("mousemove",e=>{const dx=e.clientX-innerWidth/2,dy=e.clientY-innerHeight/2;
  SB.querySelectorAll(".st").forEach(s=>s.style.transform=`translate(${dx*s.dataset.k}px,${dy*s.dataset.k}px)`)});

/* rutas */
function syncRoute(){
  const raw=location.hash.replace(/^#\/?/,"").trim().toLowerCase();
  const v=DB.routes.some(r=>r.id===raw)?raw:"inicio";
  if(location.hash!==`#/${v}`)history.replaceState(null,"",`#/${v}`);
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===`view-${v}`));
  document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("active",a.dataset.r===v));
  $("nl").classList.remove("open");
  document.title=`${DB.routes.find(r=>r.id===v).label.replace(/^[^\s]+\s/,"")} · ${DB.brand}`;
  scrollTo({top:0,behavior:"smooth"});
}

/* vista previa de la piñata */
function shape(t,f){
  const s=`fill="${f}" stroke="#fff" stroke-width="5" stroke-linejoin="round"`;
  if(t==="Tambor")return `<path d="M100 50V12" stroke="#fff" stroke-width="4"/><rect x="26" y="50" width="148" height="116" rx="26" ${s}/>`;
  if(t==="Silueta")return `<circle cx="56" cy="52" r="32" ${s}/><circle cx="144" cy="52" r="32" ${s}/><circle cx="100" cy="112" r="62" ${s}/>`;
  if(t==="3D")return `<circle cx="100" cy="100" r="80" ${s}/>`;
  return `<polygon points="100,10 123,72 190,76 138,117 156,184 100,147 44,184 62,117 10,76 77,72" ${s}/>`;
}
function preview(){
  const t=$("t-type").value,sc=DB.sizes[$("t-size").value].sc;
  $("pv").innerHTML=`<svg viewBox="0 0 200 200" style="transform:scale(${sc})"><defs>
  <pattern id="fr" width="200" height="10" patternUnits="userSpaceOnUse"><rect width="200" height="5" fill="rgba(0,0,0,.3)"/></pattern>
  <pattern id="dt" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="5" fill="#fff"/><circle cx="27" cy="27" r="5" fill="#fff"/></pattern></defs>
  ${shape(t,ST.color)}${ST.dots?shape(t,"url(#dt)"):""}${shape(t,"url(#fr)")}</svg>`;
}
let shown=0;
function calc(){
  const ty=DB.types.find(t=>t.id===$("t-type").value),sz=DB.sizes[$("t-size").value],q=Math.max(1,+$("t-cant").value||1);
  const target=Math.round(ty.baseP*sz.mult*q),from=shown,t0=performance.now();
  (function step(n){const k=Math.min(1,(n-t0)/450);shown=Math.round(from+(target-from)*k);$("t-price").textContent=`${shown} €`;if(k<1)requestAnimationFrame(step)})(t0);
  $("t-time").textContent=`⏱️ Tiempo mínimo: ${sz.time}`;
  preview();
}

function render(){
  const tick=["⭐ 100% artesanales","🎀 Hechas a mano con ilusión","✨ Diseños únicos a tu medida","📅 Encarga con 2 semanas de antelación","🎉 Para cumpleaños, bodas y eventos"].map(x=>`<span>${x}</span>`).join("");
  const types=[...new Set(DB.gallery.map(g=>g.type))];
  $("app").innerHTML=`
  <header><div class="nav">
    <a href="#/inicio" class="logo">⭐ Piñatas <span>Estrella</span></a>
    <nav class="links" id="nl">${DB.routes.map(r=>`<a href="#/${r.id}" data-r="${r.id}">${r.label}</a>`).join("")}</nav>
    <button id="burger" aria-label="Abrir menú">☰</button>
  </div></header>
  <main>
  <div class="view" id="view-inicio">
    <section class="hero">
      <div>
        <span class="badge">✨ Magia, color y diversión artesanal</span>
        <h1>Haz que tu fiesta brille con Piñatas Estrella</h1>
        <p>Creamos piñatas únicas, hechas a mano con dedicación. Tiempo mínimo de encargo: <b class="hl">2 semanas</b>.</p>
        <div class="cta"><a href="#/personalizador" class="btn">🪄 Diseña tu piñata</a><a href="#/galeria" class="btn y">✨ Ver galería</a></div>
      </div>
      <div class="hero-img"><img id="logo" src="${LOGO}" alt="Logo de Piñatas Estrella: piñata de Minnie Mouse con lazo de lunares"><span class="tip">👆 ¡Tócala!</span></div>
    </section>
    <div class="tick"><div class="tk">${tick}${tick}</div></div>
    <div class="wrap">
      <div class="head"><div class="dots"></div><h2>¿Qué estás buscando?</h2><p>Elige por dónde empezar.</p></div>
      <div class="grid">
        <div class="card"><div><div class="ico"><span style="font-size:3.4rem">📏</span></div><h3>Tamaños</h3><p class="meta">Medidas orientativas y plazos desde 2 semanas.</p></div><a href="#/tamanos" class="btn">Ver tamaños</a></div>
        <div class="card"><div><div class="ico"><span style="font-size:3.4rem">🪄</span></div><h3>Diseñador</h3><p class="meta">Elige forma, color y tamaño y mira tu piñata al instante, con precio y plazo.</p></div><a href="#/personalizador" class="btn">Diseñar ahora</a></div>
        <div class="card"><div><div class="ico"><span style="font-size:3.4rem">✨</span></div><h3>Galería</h3><p class="meta">Creaciones reales que ya hemos entregado.</p></div><a href="#/galeria" class="btn">Ver galería</a></div>
      </div>
    </div>
  </div>

  <div class="view" id="view-tamanos"><div class="wrap">
    <div class="head"><div class="dots"></div><h2>Tamaños y medidas</h2><p>Todas se elaboran a mano bajo encargo. El tiempo mínimo es de <b class="hl">2 semanas</b>.</p></div>
    <div class="grid">${DB.sizesData.map((s,i)=>`
      <div class="card"><div>
        <div class="ico"><span style="font-size:${2.2+i*.85}rem">${s.emoji}</span></div>
        <h3>${s.name}</h3><p class="hl">📏 ${s.measure}</p><p class="meta" style="margin-top:6px">${s.desc}</p></div>
        <div><p class="meta hl">⏱️ ${s.time}</p><div class="price">${s.priceRef}</div>
        <a href="#/personalizador" class="btn size-pick" data-i="${i}" style="width:100%;margin-top:10px">Elegir este tamaño</a></div></div>`).join("")}
    </div></div></div>

  <div class="view" id="view-galeria"><div class="wrap">
    <div class="head"><div class="dots"></div><h2>Galería de piñatas</h2><p>Una muestra de nuestros trabajos más queridos.</p></div>
    <div class="chips" id="chips"><button class="chip on" data-f="all">Todas</button>${types.map(t=>`<button class="chip" data-f="${t}">${t}</button>`).join("")}</div>
    <div class="grid">${DB.gallery.map(g=>`
      <div class="card gcard" data-type="${g.type}"><div>
        ${g.img?`<img class="gimg" style="object-position:${g.pos||"center 30%"}" src="${g.img}" alt="${g.title}" loading="lazy">`:`<div class="ico"><span style="font-size:4rem">${g.emoji}</span></div>`}
        <span class="tag">${g.type}${g.size?" · "+g.size:""}</span><h3>${g.title}</h3><p class="meta">${g.imgDesc}</p></div>
        <a href="#/contacto" class="btn">Encargar una similar</a></div>`).join("")}
    </div></div></div>

  <div class="view" id="view-personalizador"><div class="wrap">
    <div class="head"><div class="dots"></div><h2>Diseña tu piñata a medida</h2><p>Cambia las opciones y mira cómo queda. Plazo mínimo: 2 semanas.</p></div>
    <div class="split">
      <div class="panel">
        <label>Tipo de piñata<select id="t-type">${DB.types.map(t=>`<option value="${t.id}">${t.emoji} ${t.name} (desde ${t.baseP} €)</option>`).join("")}</select></label>
        <label>Tamaño<select id="t-size">${Object.keys(DB.sizes).map(s=>`<option>${s}</option>`).join("")}</select></label>
        <label>Color principal<div class="sws" id="sws">${DB.colors.map(([n,c],i)=>`<button type="button" class="sw${i?"":" on"}" data-c="${c}" data-n="${n}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join("")}</div></label>
        <label class="ck"><input type="checkbox" id="t-dots" checked> Con lunares blancos</label>
        <label>Temática o detalles<input id="t-custom" placeholder="Ej: princesas, colores pastel, un nombre…"></label>
        <label>Cantidad<input id="t-cant" type="number" min="1" value="1"></label>
      </div>
      <div class="panel">
        <div class="pv" id="pv"></div>
        <div class="est"><span class="meta">Precio estimado</span><b id="t-price">0 €</b><span class="time" id="t-time"></span></div>
        <button type="button" class="btn" id="t-use" style="width:100%">Enviar este diseño al pedido</button>
      </div>
    </div></div></div>

  <div class="view" id="view-contacto"><div class="wrap">
    <div class="head"><div class="dots"></div><h2>Encarga tu piñata</h2><p>Completa el formulario. Recuerda el plazo mínimo de 2 semanas.</p></div>
    <div class="panel" style="max-width:700px">
    <form id="form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="${DB.web3Key}">
      <input type="hidden" name="subject" id="f-subject" value="Nuevo encargo en Piñatas Estrella">
      <input type="hidden" name="from_name" value="${DB.brand}">
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
      <div class="row">
        <label>Motivo del contacto<select id="operacion" name="Operacion" required><option value="Encargo de piñata personalizada">Encargo de piñata</option><option value="Consulta sobre diseño o tiempos">Consulta general</option></select></label>
        <label>Fecha del evento (mínimo 2 semanas)<input id="fecha" name="Fecha_Evento" type="date" required></label>
      </div>
      <label>Detalle del pedido o diseño<input id="articulo" name="Detalle_Encargo" placeholder="Diseñada a medida…" required></label>
      <div class="row">
        <label>Cantidad<input id="cantidad" name="Cantidad" type="number" min="1" value="1"></label>
        <label>Presupuesto orientativo (€)<input id="precio" name="Presupuesto_EUR" type="number" min="0" placeholder="Opcional"></label>
      </div>
      <label>Materiales y acabados (opcional)<select name="Materiales_Extras">
        <option>Estándar (papel china / crepé tradicional)</option><option>Papel metalizado / brillante especial</option><option>Estructura reforzada extra resistente</option><option>Incluir kit sorpresa (confeti y golosinas)</option></select></label>
      <div class="row">
        <label>Tu nombre<input name="Nombre" placeholder="Nombre completo" required></label>
        <label>Zona / ciudad<input name="Ubicacion" placeholder="Ej: Madrid" required></label>
      </div>
      <div class="row">
        <label>Correo electrónico<input name="email" type="email" placeholder="tu@correo.com" required></label>
        <label>Teléfono o WhatsApp<input name="Telefono" type="tel" placeholder="600 000 000" required></label>
      </div>
      <label>Cuéntanos detalles, colores y temática<textarea id="mensaje" name="Mensaje" rows="4" placeholder="Describe cómo imaginas la piñata perfecta…" required></textarea></label>
      <button class="btn" id="send" type="submit" style="width:100%">✨ Enviar pedido</button>
    </form></div></div></div>

  <div class="view" id="view-faq"><div class="wrap">
    <div class="head"><div class="dots"></div><h2>Preguntas frecuentes</h2><p>Lo que conviene saber antes de encargar.</p></div>
    <div style="max-width:760px">${DB.faqs.map(f=>`<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join("")}</div>
  </div></div>
  </main>
  <footer><p>© ${new Date().getFullYear()} <b>Piñatas Estrella</b> · Hecha a mano con ilusión para tus mejores momentos ⭐</p></footer>`;
}

render();
$("fecha").min=new Date(Date.now()+14*864e5).toISOString().split("T")[0];
$("burger").onclick=()=>$("nl").classList.toggle("open");
$("logo").onclick=e=>{const r=e.target.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,120)};
$("chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  document.querySelectorAll(".gcard").forEach(g=>g.style.display=c.dataset.f==="all"||g.dataset.type===c.dataset.f?"":"none")};
$("sws").onclick=e=>{const b=e.target.closest(".sw");if(!b)return;
  document.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b));ST.color=b.dataset.c;ST.name=b.dataset.n;preview()};
$("t-dots").onchange=e=>{ST.dots=e.target.checked;preview()};
["t-type","t-size","t-cant"].forEach(id=>$(id).addEventListener("input",calc));
document.querySelectorAll(".size-pick").forEach(a=>a.addEventListener("click",()=>{$("t-size").selectedIndex=+a.dataset.i;calc()}));
calc();

$("t-use").onclick=()=>{
  const ty=DB.types.find(t=>t.id===$("t-type").value),sk=$("t-size").value,sz=DB.sizes[sk],q=Math.max(1,+$("t-cant").value||1),cu=$("t-custom").value.trim();
  $("operacion").value="Encargo de piñata personalizada";
  $("articulo").value=`${ty.name} - Tamaño ${sk} (${q} ud)`;
  $("cantidad").value=q;
  $("precio").value=Math.round(ty.baseP*sz.mult*q);
  $("mensaje").value=`Diseño personalizado desde la web:\n- Estilo: ${ty.name}\n- Tamaño: ${sk}\n- Color: ${ST.name||"Rojo"}${ST.dots?" con lunares blancos":""}\n- Tiempo estimado: ${sz.time}\n- Detalles: ${cu||"Ninguno"}`;
  location.hash="#/contacto";notify("📋 ¡Diseño pasado al formulario!");
};

$("form").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("send");b.disabled=true;b.textContent="⏳ Enviando pedido…";
  $("f-subject").value=`${$("operacion").value}: ${$("articulo").value}`;
  try{
    const r=await fetch(e.target.action,{method:"POST",headers:{Accept:"application/json"},body:new FormData(e.target)});
    const d=await r.json();
    if(d.success){notify("✨ ¡Pedido enviado! Te contactaremos pronto.");e.target.reset();burst(innerWidth/2,innerHeight/2,160)}else throw 0;
  }catch(_){notify("❌ No se pudo enviar. Inténtalo de nuevo.")}
  b.disabled=false;b.textContent="✨ Enviar pedido";
});
addEventListener("keydown",e=>{if(e.key==="Escape")$("lb").classList.remove("on")});addEventListener("hashchange",syncRoute);syncRoute();
</script>
</body>
</html>
